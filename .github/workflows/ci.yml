name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo check
        run: cargo check --workspace

      - name: Audit benchmark compile (informational)
        run: cargo bench -p clawcrate-audit --no-run

      # The release ships musl binaries, and musl is not glibc: `ioctl`'s
      # request parameter is `c_int` there and `c_ulong` here, so a type that
      # compiles on this runner can still fail the release build. Checking the
      # release targets here means that failure surfaces on the pull request
      # rather than after a tag is pushed. `check` needs no linker, so it costs
      # a fraction of a real cross build.
      - name: Cargo check release targets (musl)
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          cargo check -p clawcrate-sandbox --target x86_64-unknown-linux-musl
          cargo check -p clawcrate-sandbox --target aarch64-unknown-linux-musl
        continue-on-error: true

  integration-and-fixtures:
    name: Integration + Fixtures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Workspace tests
        run: cargo test --workspace

      - name: CLI integration tests
        run: cargo test -p clawcrate-cli --test install_replica_integration

      - name: CLI golden output tests
        run: cargo test -p clawcrate-cli --test golden_cli_outputs

      - name: Sandbox security fixtures
        run: cargo test -p clawcrate-sandbox --test security_fixtures
